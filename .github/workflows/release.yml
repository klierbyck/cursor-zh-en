name: Build and publish release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The ACL tests launch Windows PowerShell; keep its module path native.
      - run: npm run verify
        shell: powershell
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches application version
        shell: bash
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "Tag must be $expected" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release
      - name: Check all release assets exist
        shell: bash
        run: |
          test -f release/latest.yml
          test "$(compgen -G 'release/*.exe' | wc -l)" -eq 1
          test "$(compgen -G 'release/*.blockmap' | wc -l)" -eq 1
      - name: Publish installation files and update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.exe release/*.blockmap release/latest.yml --verify-tag --title "Cursor 汉化助手 $GITHUB_REF_NAME" --notes "Windows x64 安装包；本次不提供 macOS 安装包。源码 ZIP/TAR 由 GitHub 自动附加。"
