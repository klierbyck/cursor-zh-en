name: Build and publish release

on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current version after rebuilding all installers
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version and lockfile
        id: check
        shell: bash
        run: |
          version=$(jq -r .version package.json)
          locked=$(jq -r .version package-lock.json)
          test "$version" = "$locked" || { echo 'package-lock.json version differs' >&2; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable X.Y.Z version' >&2; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          changed=false
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            previous=$(git show "${{ github.event.before }}:package.json" | jq -r .version)
            if [[ "$version" != "$previous" ]]; then changed=true; fi
          elif [[ "${{ inputs.publish }}" == true ]]; then
            changed=true
          fi
          if [[ "$changed" == true ]] && git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "Tag v$version already exists" >&2
            exit 1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  windows:
    needs: [version]
    if: needs.version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The ACL tests launch Windows PowerShell; keep its module path native.
      - run: npm run verify
        shell: powershell
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  macos:
    needs: [version]
    if: needs.version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  publish:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installers'
          path: release
          merge-multiple: true
      - name: Check all release assets exist
        shell: bash
        run: |
          test -f release/latest.yml
          test -f release/latest-mac.yml
          test "$(compgen -G 'release/*.exe' | wc -l)" -eq 1
          test "$(compgen -G 'release/*.dmg' | wc -l)" -eq 2
          test "$(compgen -G 'release/*.zip' | wc -l)" -eq 2
          test "$(compgen -G 'release/*.blockmap' | wc -l)" -ge 1
      - name: Publish version and installation files
        if: needs.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" release/*.exe release/*.dmg release/*.zip release/*.blockmap release/latest.yml release/latest-mac.yml --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Cursor 汉化助手 $TAG" --notes "Windows x64、macOS Intel 和 Apple Silicon 安装包；源码 ZIP/TAR 由 GitHub 自动附加。"
